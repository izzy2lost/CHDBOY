apply plugin: "com.android.application"

android {
    namespace = 'com.chdboy'
    compileSdk = 36

    // The NDK installed on this machine. Clang 21, which is what the -O3
    // vectorisation of the CD codec's inner loops is worth having.
    ndkVersion = "30.0.15729638"

    defaultConfig {
        applicationId = "com.chdboy"
        minSdk = 23
        targetSdk = 36
        versionCode = 2
        versionName = "1.1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // One APK with both ABIs rather than a per-ABI split.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        externalNativeBuild {
            cmake {
                // Deliberately Release for BOTH variants. AGP would otherwise
                // hand CMake Debug for a debug APK, which builds libchdr and
                // zstd unoptimised -- and a conversion that takes eight
                // minutes at -O3 takes most of an hour at -O0, which reads as
                // a hang rather than as a debug build.
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    packaging {
        jniLibs {
            // Store the converter uncompressed and map it directly instead of
            // extracting a second copy into /data/app.
            useLegacyPackaging = false
        }
    }

    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
            version = "3.30.3"
        }
    }

    signingConfigs {
        // Release is signed with the debug key so `assembleRelease` produces
        // something installable out of the box. Replace this with a real
        // keystore before distributing anything.
        release {
            initWith debug
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.documentfile:documentfile:1.0.1"

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
