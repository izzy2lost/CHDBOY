name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # The converter is built from source against this exact NDK. Without the
    # pin the runner's default is used, and that has drifted between images.
    - name: install NDK
      run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;30.0.15729638" "cmake;3.30.3"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Release, not debug: the native code is -O3 either way, but a debug APK
    # ships unshrunk and unsigned-for-distribution, and release is what anyone
    # downloading an artifact actually wants to install.
    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Store universal release APK
      uses: actions/upload-artifact@v4
      with:
        name: chdboy-universal-release
        path: app/build/outputs/apk/release/app-release.apk
